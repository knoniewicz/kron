name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1 && gitleaks dir . --no-banner
